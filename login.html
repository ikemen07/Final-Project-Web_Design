<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk Akun — SKINORA</title>
  <meta name="description" content="Masuk ke akun pelanggan atau portal administrator SKINORA." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            skinora: {
              pink: '#E8A0B8',
              rose: '#C96F91',
              soft: '#FCE8EF',
              darkbg: '#141114',
              darkcard: '#1E1A1E'
            }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="bg-[#FFF9FB] dark:bg-[#141114] text-[#292329] dark:text-[#F7EDF2] flex flex-col min-h-screen">

  <!-- TOP HEADER -->
  <header class="py-6 px-4 sm:px-8 border-b border-pink-100 dark:border-pink-900/30 bg-white/80 dark:bg-[#1E1A1E]/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 group">
        <div class="w-9 h-9 rounded-full bg-[#C96F91] flex items-center justify-center text-white text-sm">
          <i class="fa-solid fa-spa"></i>
        </div>
        <span class="font-serif text-2xl font-bold tracking-widest text-[#292329] dark:text-[#F7EDF2]">SKINORA</span>
      </a>

      <div class="flex items-center gap-4 text-xs font-semibold">
        <a href="index.html" class="hover:text-[#C96F91] transition-colors">Kembali ke Beranda</a>
      </div>
    </div>
  </header>

  <!-- MAIN LOGIN CARD -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white dark:bg-[#1E1A1E] rounded-3xl p-8 border border-pink-100 dark:border-pink-900/30 shadow-xl space-y-6">
      
      <div class="text-center space-y-1">
        <span class="text-xs font-bold text-[#C96F91] uppercase tracking-widest">Selamat Datang Kembali</span>
        <h1 class="text-3xl font-serif font-bold text-gray-900 dark:text-gray-100">Masuk Akun</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400">Pilih peran akun atau isi kredensial di bawah ini.</p>
      </div>

      <!-- Quick Demo Credentials Box -->
      <div class="p-3.5 bg-pink-50 dark:bg-pink-950/40 rounded-2xl border border-pink-100 dark:border-pink-900/40 text-xs space-y-2">
        <div class="flex items-center justify-between">
          <span class="font-bold text-pink-900 dark:text-pink-300">🔑 Akun Demo Presentasi:</span>
          <span class="text-[10px] text-gray-500">Klik untuk isi otomatis</span>
        </div>
        <div class="flex gap-2">
          <button 
            type="button" 
            data-demo-email="admin@skinora.com" data-demo-password="admin123" 
            class="flex-1 py-1.5 px-2 bg-white dark:bg-[#1E1A1E] hover:bg-pink-100 dark:hover:bg-pink-900/30 border border-pink-200 dark:border-pink-800 rounded-lg text-[11px] font-semibold text-[#C96F91] transition-colors"
          >
            👑 Demo Admin
          </button>
          <button 
            type="button" 
            data-demo-email="daniel@gmail.com" data-demo-password="12345" 
            class="flex-1 py-1.5 px-2 bg-white dark:bg-[#1E1A1E] hover:bg-pink-100 dark:hover:bg-pink-900/30 border border-pink-200 dark:border-pink-800 rounded-lg text-[11px] font-semibold text-gray-700 dark:text-gray-300 transition-colors"
          >
            🛍️ Demo Pelanggan
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold mb-1 text-gray-700 dark:text-gray-300">Alamat Email *</label>
          <input 
            type="email" 
            name="email" 
            id="login-email" 
            autocomplete="username" 
            required 
            placeholder="admin@skinora.com atau nama@email.com" 
            class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#C96F91] dark:text-gray-200"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="font-semibold text-gray-700 dark:text-gray-300">Kata Sandi *</label>
            <span class="text-[10px] text-gray-400">Min. 6 Karakter</span>
          </div>
          <input 
            type="password" 
            name="password" 
            id="login-password" 
            autocomplete="current-password" 
            required 
            placeholder="••••••••" 
            class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#C96F91] dark:text-gray-200"
          />
        </div>

        <button 
          type="submit" 
          class="btn-primary w-full py-3 text-xs font-bold shadow-md shadow-pink-500/20 mt-2"
        >
          <span>Masuk ke Akun</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <div class="text-center pt-2 text-xs text-gray-500 dark:text-gray-400 border-t border-gray-100 dark:border-gray-800">
        Belum memiliki akun pelanggan? 
        <a href="register.html" class="font-bold text-[#C96F91] hover:underline ml-1">Daftar Sekarang</a>
      </div>

    </div>
  </main>

  <footer class="py-6 text-center text-xs text-gray-400">
    <p>© <span class="current-year">2026</span> SKINORA. All rights reserved.</p>
  </footer>

  <!-- APPLICATION SCRIPTS -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Isi otomatis akun demo (admin / pelanggan)
    function fillDemo(email, password) {
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');
      emailInput.value = email;
      passInput.value = password;
      [emailInput, passInput].forEach(el => {
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.classList.remove('border-rose-500');
      });
      document.querySelectorAll('.validation-error-msg').forEach(el => el.remove());
      Notifications.toast('Kredensial demo terisi. Klik "Masuk ke Akun".', 'info');
    }

    document.querySelectorAll('[data-demo-email]').forEach(btn => {
      btn.addEventListener('click', () => fillDemo(btn.dataset.demoEmail, btn.dataset.demoPassword));
    });

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const form = e.target;
      const email = form['email'].value;
      const password = form['password'].value;

      if (!Validation.isEmail(email)) {
        Notifications.toast('Format email tidak valid.', 'error');
        return;
      }

      if (!Validation.isMinLength(password, 6)) {
        Notifications.toast('Kata sandi minimal 6 karakter.', 'error');
        return;
      }

      const res = Auth.login(email, password);
      if (res.success) {
        Notifications.toast(res.message, 'success');
        setTimeout(() => {
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect');
          if (redirect) {
            window.location.href = redirect;
          } else if (res.user.role === 'admin') {
            window.location.href = 'dashboard.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 800);
      } else {
        Notifications.toast(res.message, 'error');
      }
    });
  </script>
</body>
</html>
