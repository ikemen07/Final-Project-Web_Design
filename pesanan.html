<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status Pesanan — SKINORA</title>
  <meta name="description" content="Lacak status pesanan SKINORA: dibuat, diproses, dikirim, dan selesai." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            skinora: {
              pink: '#E8A0B8',
              rose: '#C96F91',
              soft: '#FCE8EF',
              darkbg: '#141114',
              darkcard: '#1E1A1E'
            }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="bg-[#FFF9FB] dark:bg-[#141114] text-[#292329] dark:text-[#F7EDF2] flex flex-col min-h-screen">

  <!-- Navigasi bersama: lihat js/layout.js -->
  <div id="site-header"></div>

  <main class="flex-1 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12 w-full">

    <div class="mb-8">
      <h1 class="text-3xl sm:text-4xl font-serif font-bold text-gray-900 dark:text-gray-100">Status Pesanan</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">Lihat sampai mana paket Anda: dibuat, diproses, dikirim, atau sudah selesai.</p>
    </div>

    <!-- Cari nomor pesanan -->
    <form id="track-form" class="flex flex-col sm:flex-row gap-3 mb-8 p-4 bg-white dark:bg-[#1E1A1E] rounded-2xl border border-pink-100 dark:border-pink-900/30 shadow-sm" novalidate>
      <label for="track-input" class="sr-only">Nomor pesanan</label>
      <input id="track-input" type="text" inputmode="text" autocomplete="off" placeholder="Masukkan nomor pesanan, contoh: SKN-202611-89F1"
        class="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-transparent text-sm font-mono uppercase focus:outline-none focus:border-[#C96F91]" />
      <button type="submit" class="btn-primary text-sm justify-center"><i class="fa-solid fa-magnifying-glass text-xs"></i><span>Lacak pesanan</span></button>
    </form>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <!-- Daftar pesanan akun -->
      <aside id="order-list-panel" class="lg:col-span-4 hidden">
        <h2 class="font-serif text-xl font-bold mb-3">Pesanan Anda</h2>
        <div id="order-list" class="space-y-2.5 max-h-[560px] overflow-y-auto pr-1"></div>
      </aside>

      <!-- Detail & tracker -->
      <section id="order-detail-panel" class="lg:col-span-8 lg:col-start-5 w-full" aria-live="polite"></section>
    </div>
  </main>

  <footer class="bg-white dark:bg-[#1E1A1E] border-t border-pink-100 dark:border-pink-900/30 py-8 mt-16 text-center text-xs text-gray-400">
    <p>© <span class="current-year">2026</span> SKINORA. All rights reserved.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pesanan.js"></script>
</body>
</html>
