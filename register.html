<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Akun Baru — SKINORA</title>
  <meta name="description" content="Registrasi akun pelanggan SKINORA untuk kemudahan belanja dan riwayat pesanan." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            skinora: {
              pink: '#E8A0B8',
              rose: '#C96F91',
              soft: '#FCE8EF',
              darkbg: '#141114',
              darkcard: '#1E1A1E'
            }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="bg-[#FFF9FB] dark:bg-[#141114] text-[#292329] dark:text-[#F7EDF2] flex flex-col min-h-screen">

  <!-- TOP HEADER -->
  <header class="py-6 px-4 sm:px-8 border-b border-pink-100 dark:border-pink-900/30 bg-white/80 dark:bg-[#1E1A1E]/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 group">
        <div class="w-9 h-9 rounded-full bg-[#C96F91] flex items-center justify-center text-white text-sm">
          <i class="fa-solid fa-spa"></i>
        </div>
        <span class="font-serif text-2xl font-bold tracking-widest text-[#292329] dark:text-[#F7EDF2]">SKINORA</span>
      </a>

      <div class="flex items-center gap-4 text-xs font-semibold">
        <a href="login.html" class="hover:text-[#C96F91] transition-colors">Sudah punya akun? Masuk</a>
      </div>
    </div>
  </header>

  <!-- MAIN REGISTER CARD -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg bg-white dark:bg-[#1E1A1E] rounded-3xl p-8 border border-pink-100 dark:border-pink-900/30 shadow-xl space-y-6">
      
      <div class="text-center space-y-1">
        <span class="text-xs font-bold text-[#C96F91] uppercase tracking-widest">Bergabung Bersama Kami</span>
        <h1 class="text-3xl font-serif font-bold text-gray-900 dark:text-gray-100">Daftar Akun Baru</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400">Buat akun untuk melacak pesanan dan konsultasi kecantikan personal.</p>
      </div>

      <!-- Registration Form -->
      <form id="register-form" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold mb-1 text-gray-700 dark:text-gray-300">Nama Lengkap *</label>
          <input 
            type="text" 
            name="name" 
            required 
            placeholder="Contoh: Siti Rahmawati" 
            class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#C96F91] dark:text-gray-200"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold mb-1 text-gray-700 dark:text-gray-300">Alamat Email *</label>
            <input 
              type="email" 
              name="email" 
              required 
              placeholder="nama@email.com" 
              class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#C96F91] dark:text-gray-200"
            />
          </div>
          <div>
            <label class="block font-semibold mb-1 text-gray-700 dark:text-gray-300">Nomor WhatsApp *</label>
            <input 
              type="tel" 
              name="phone" 
              required 
              placeholder="081234567890" 
              class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#C96F91] dark:text-gray-200"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold mb-1 text-gray-700 dark:text-gray-300">Kata Sandi (Min. 6) *</label>
            <input 
              type="password" 
              name="password" 
              required 
              placeholder="••••••••" 
              class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#C96F91] dark:text-gray-200"
            />
          </div>
          <div>
            <label class="block font-semibold mb-1 text-gray-700 dark:text-gray-300">Ulangi Kata Sandi *</label>
            <input 
              type="password" 
              name="confirmPassword" 
              required 
              placeholder="••••••••" 
              class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#C96F91] dark:text-gray-200"
            />
          </div>
        </div>

        <div>
          <label class="block font-semibold mb-1 text-gray-700 dark:text-gray-300">Alamat Pengiriman (Opsional)</label>
          <input 
            type="text" 
            name="address" 
            placeholder="Jalan, nomor rumah, kelurahan, kecamatan" 
            class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#C96F91] dark:text-gray-200"
          />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold mb-1 text-gray-700 dark:text-gray-300">Kota</label>
            <input 
              type="text" 
              name="city" 
              placeholder="Jakarta Selatan" 
              class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#C96F91] dark:text-gray-200"
            />
          </div>
          <div>
            <label class="block font-semibold mb-1 text-gray-700 dark:text-gray-300">Kode Pos</label>
            <input 
              type="text" 
              name="postalCode" 
              placeholder="12190" 
              maxlength="5" 
              class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#C96F91] dark:text-gray-200"
            />
          </div>
        </div>

        <button 
          type="submit" 
          class="btn-primary w-full py-3.5 text-xs font-bold shadow-md shadow-pink-500/20 mt-4"
        >
          <span>Buat Akun Pelanggan</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <div class="text-center pt-2 text-xs text-gray-500 dark:text-gray-400 border-t border-gray-100 dark:border-gray-800">
        Sudah memiliki akun? 
        <a href="login.html" class="font-bold text-[#C96F91] hover:underline ml-1">Masuk Sekarang</a>
      </div>

    </div>
  </main>

  <footer class="py-6 text-center text-xs text-gray-400">
    <p>© <span class="current-year">2026</span> SKINORA. All rights reserved.</p>
  </footer>

  <!-- APPLICATION SCRIPTS -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const form = e.target;
      const name = form['name'].value.trim();
      const email = form['email'].value.trim();
      const phone = form['phone'].value.trim();
      const password = form['password'].value;
      const confirmPassword = form['confirmPassword'].value;
      const address = form['address'].value.trim();
      const city = form['city'].value.trim();
      const postalCode = form['postalCode'].value.trim();

      if (name.length < 3) {
        Notifications.toast('Nama lengkap minimal 3 karakter.', 'error');
        return;
      }

      if (!Validation.isEmail(email)) {
        Notifications.toast('Format alamat email tidak valid.', 'error');
        return;
      }

      if (!Validation.isPhoneNumber(phone)) {
        Notifications.toast('Nomor telepon/WhatsApp tidak valid (contoh: 081234567890).', 'error');
        return;
      }

      if (!Validation.isMinLength(password, 6)) {
        Notifications.toast('Kata sandi minimal 6 karakter.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        Notifications.toast('Konfirmasi kata sandi tidak cocok.', 'error');
        return;
      }

      const res = Auth.register({
        name,
        email,
        phone,
        password,
        address,
        city,
        postalCode
      });

      if (res.success) {
        Notifications.toast('Pendaftaran akun berhasil! Selamat berbelanja.', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } else {
        Notifications.toast(res.message, 'error');
      }
    });
  </script>
</body>
</html>
